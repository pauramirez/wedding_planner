name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install backend
        working-directory: backend
        run: npm install

      - name: Install frontend
        working-directory: frontend
        run: npm install

      # Build the SPA first so the [assets] directory referenced by
      # wrangler.toml exists before any wrangler command runs.
      - name: Build frontend
        working-directory: frontend
        env:
          # Empty base: SPA and API are on the same origin (Worker), so
          # relative URLs like /api/foo Just Work and cookies are first-party.
          VITE_API_BASE: ""
          VITE_DD_RUM_APP_ID: ${{ secrets.DD_RUM_APP_ID }}
          VITE_DD_RUM_CLIENT_TOKEN: ${{ secrets.DD_RUM_CLIENT_TOKEN }}
          VITE_DD_ENV: production
        run: npm run build

      - name: Diagnostic — wrangler version, config, D1 list
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "--- wrangler version ---"
          npx wrangler --version
          echo "--- wrangler.toml ---"
          cat wrangler.toml
          echo "--- dist listing ---"
          ls -la ../frontend/dist | head -10
          echo "--- D1 list (tests API token permissions) ---"
          npx wrangler d1 list || echo "D1 list failed"

      - name: Apply D1 migrations (remote)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply wedding-planner --remote 2>&1

      - name: Deploy Worker (with bundled frontend)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy
