name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Install backend
        working-directory: backend
        run: npm install

      - name: Install frontend
        working-directory: frontend
        run: npm install

      - name: Apply D1 migrations (remote)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply wedding-planner --remote

      # Build the SPA before deploying the Worker — the Worker bundles
      # frontend/dist as its static assets (see wrangler.toml [assets]).
      - name: Build frontend
        working-directory: frontend
        env:
          # Empty base: the SPA and API are on the same origin (Worker), so
          # relative URLs like /api/foo Just Work and cookies are first-party.
          VITE_API_BASE: ""
          VITE_DD_RUM_APP_ID: ${{ secrets.DD_RUM_APP_ID }}
          VITE_DD_RUM_CLIENT_TOKEN: ${{ secrets.DD_RUM_CLIENT_TOKEN }}
          VITE_DD_ENV: production
        run: npm run build

      - name: Deploy Worker (with bundled frontend)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy
