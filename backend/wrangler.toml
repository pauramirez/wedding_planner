name = "weddingplanner"
main = "src/index.js"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Static assets: the built React SPA. The Worker only runs for /api/*;
# everything else is served by Cloudflare's asset server. Unmatched paths
# fall back to index.html so client-side navigation works.
[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 binding — the database is created via `wrangler d1 create wedding-planner`.
[[d1_databases]]
binding = "DB"
database_name = "wedding-planner"
database_id = "d4f4e25f-1035-4014-8807-02f70e852954"
migrations_dir = "../db/migrations"

# Non-secret vars go here. Secrets (SESSION_SECRET, DD_API_KEY) are set with:
#   wrangler secret put SESSION_SECRET
[vars]
DD_SITE = "datadoghq.com"
DD_SERVICE = "weddingplanner"
DD_ENV = "production"
FRONTEND_ORIGIN = "https://weddingplanner.paujrg95.workers.dev"

[env.dev.vars]
DD_ENV = "dev"
FRONTEND_ORIGIN = "http://localhost:5173"
